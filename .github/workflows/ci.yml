name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests
        run: dotnet test -c Release
      - name: Publish single-file exes
        shell: pwsh
        run: |
          dotnet publish src/GameOptimizer.App -c Release -r win-x64 -o dist
          dotnet publish src/GameOptimizer.Cli -c Release -r win-x64 -o dist
          Copy-Item LICENSE, NOTICE, CREDITS.md dist/
      - name: Smoke test the command line
        run: dist/gameopt.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: GameOptimizer
          path: |
            dist/GameOptimizer.exe
            dist/gameopt.exe
            dist/LICENSE
            dist/NOTICE
            dist/CREDITS.md
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameOptimizer
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "GameOptimizer $GITHUB_REF_NAME" --generate-notes
