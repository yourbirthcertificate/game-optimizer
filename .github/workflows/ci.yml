name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests
        run: dotnet test -c Release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Publish the app and command line tool, then build the setup program
        shell: pwsh
        run: ./installer/build.ps1
      - name: Smoke test the command line
        shell: pwsh
        run: |
          dist/optigame-cli.exe --help
          dist/gameopt.exe --help
      - name: Gather files
        shell: pwsh
        run: Copy-Item LICENSE, NOTICE, CREDITS.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: OptiGame
          path: |
            dist/OptiGame-Setup-*.exe
            dist/OptiGame.exe
            dist/optigame-cli.exe
            dist/gameopt.exe
            dist/LICENSE
            dist/NOTICE
            dist/CREDITS.md
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OptiGame
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The setup program must be attached: the in-app updater looks for OptiGame-Setup-*.exe and checks its digest.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "OptiGame+ $GITHUB_REF_NAME" --generate-notes
